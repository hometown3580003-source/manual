<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ゆうほちゃんタイマー</title>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@700&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #ff6eb4;
    --accent2: #c084fc;
    --accent3: #ffb347;
    --green: #5dba7a;
    --muted: #b899a8;
    --border: #ffd6e8;
    --shadow: rgba(255,110,180,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #fff5f9;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,157,226,0.2) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(192,132,252,0.15) 0%, transparent 40%);
    font-family: 'M PLUS Rounded 1c', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
  }
  .container {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .mascot {
    font-size: 28px;
    animation: bounce 2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .header h1 {
    font-family: 'Kaisei Decol', serif;
    font-size: 18px;
    color: var(--accent);
    text-shadow: 0 2px 6px rgba(255,110,180,0.3);
  }
  .cheer-box {
    background: linear-gradient(135deg, #fff0f7, #f8f0ff);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 8px 12px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    box-shadow: 0 3px 8px var(--shadow);
  }
  .time-select {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
  }
  .time-btn {
    background: white;
    border: 2px solid var(--border);
    color: var(--muted);
    padding: 6px 2px;
    border-radius: 10px;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .time-btn .emoji { display: block; font-size: 13px; margin-bottom: 1px; }
  .time-btn.active {
    background: linear-gradient(135deg, #ff6eb4, #c084fc);
    border-color: transparent;
    color: white;
    box-shadow: 0 3px 8px rgba(255,110,180,0.4);
  }
  .timer-display {
    background: white;
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 14px 16px 12px;
    text-align: center;
    box-shadow: 0 6px 18px var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .timer-display::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, #ff6eb4, #c084fc, #ffb347, #ff6eb4);
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
  }
  @keyframes shimmer {
    0% { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
  }
  .elapsed-label { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 4px; }
  .time-big {
    font-family: 'Kaisei Decol', serif;
    font-size: 58px;
    font-weight: 700;
    line-height: 1;
    color: #3a2a35;
    transition: color 0.3s;
    letter-spacing: -2px;
  }
  .time-big.running { color: var(--accent); }
  .time-big.warning { color: var(--accent3); }
  .time-big.done-color { color: var(--green); }
  .total-label { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .segments {
    display: flex; gap: 4px; justify-content: center;
    margin-top: 8px; flex-wrap: wrap;
  }
  .seg { font-size: 15px; opacity: 0.2; transition: all 0.4s; filter: grayscale(1); }
  .seg.passed { opacity: 0.5; filter: grayscale(0.3); }
  .seg.current { opacity: 1; filter: grayscale(0); animation: hb 1s ease-in-out infinite; }
  @keyframes hb { 0%,100%{transform:scale(1)} 50%{transform:scale(1.25)} }
  .announce-banner {
    background: linear-gradient(135deg, #fff0f7, #f8f0ff);
    border: 2px solid #ff9de2;
    border-radius: 12px;
    padding: 8px 12px;
    text-align: center;
    font-size: 13px;
    font-weight: 800;
    color: var(--accent);
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px var(--shadow);
    opacity: 0;
    transform: scale(0.95);
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .announce-banner.visible { opacity: 1; transform: scale(1); }
  .announce-banner.done-banner {
    background: linear-gradient(135deg, #f0fff4, #e0f8ff);
    border-color: var(--green);
    color: var(--green);
  }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn {
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:active { transform: scale(0.96); }
  .btn-start {
    background: linear-gradient(135deg, #ff6eb4, #c084fc);
    color: white;
    grid-column: span 2;
    font-size: 16px;
    box-shadow: 0 5px 14px rgba(255,110,180,0.4);
  }
  .btn-pause {
    background: linear-gradient(135deg, #ffe0a0, #ffb347);
    color: white;
  }
  .btn-reset { background: #f0f0f0; color: var(--muted); }
  .confetti-piece {
    position: fixed; width: 9px; height: 9px; border-radius: 2px;
    pointer-events: none;
    animation: cf 2.5s ease-in forwards;
    z-index: 999;
  }
  @keyframes cf {
    0%   { transform: translateY(-20px) rotate(0deg); opacity:1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity:0; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="mascot" id="mascot">🌸</span>
    <h1>ゆうほちゃんタイマー ✨</h1>
  </div>
  <div class="cheer-box" id="cheerBox">🌟 今日もゆうほちゃんならできるよ！</div>
  <div class="time-select">
    <button class="time-btn active" data-min="15" onclick="selectTime(this)"><span class="emoji">⭐</span>15分</button>
    <button class="time-btn" data-min="20" onclick="selectTime(this)"><span class="emoji">🌙</span>20分</button>
    <button class="time-btn" data-min="25" onclick="selectTime(this)"><span class="emoji">🌈</span>25分</button>
    <button class="time-btn" data-min="30" onclick="selectTime(this)"><span class="emoji">🎀</span>30分</button>
    <button class="time-btn" data-min="45" onclick="selectTime(this)"><span class="emoji">💫</span>45分</button>
    <button class="time-btn" data-min="60" onclick="selectTime(this)"><span class="emoji">👑</span>60分</button>
  </div>
  <div class="timer-display">
    <div class="elapsed-label">⏱ けいかじかん</div>
    <div class="time-big" id="timeBig">00:00</div>
    <div class="total-label" id="totalLabel">/ 15:00</div>
    <div class="segments" id="segments"></div>
  </div>
  <div class="announce-banner visible" id="announceBanner">🎵 スタートをおしてね！</div>
  <div class="controls">
    <button class="btn btn-start" id="btnStart" onclick="startTimer()">✨ スタート！</button>
    <button class="btn btn-pause" id="btnPause" onclick="pauseTimer()" style="display:none">⏸ ちょっとまって</button>
    <button class="btn btn-reset" id="btnReset" onclick="resetTimer()" style="display:none">🔄 やりなおす</button>
  </div>

  <div style="text-align:center; font-size:10px; color:#c8a0b8; line-height:1.7;">
    🔊 音量を上げておいてね　／　🔒 自動ロックは「なし」にしておいてね
  </div>
</div>
<script>
let totalMinutes=15, elapsed=0, timer=null, running=false, lastAnnounced=-1;
const cheerMessages=[
  '🌟 今日もゆうほちゃんならできるよ！',
  '💪 集中したらあっという間だよ！',
  '🌸 ゆうほちゃんはすごいね！',
  '✨ きっとうまくいくよ！',
  '🎀 がんばれ、ゆうほちゃん！',
  '🌈 ゆうほちゃんのこと応援してるよ！',
];
const mascots=['🌸','⭐','🎀','🌙','💫','🌈'];

function selectTime(btn){
  if(running)return;
  document.querySelectorAll('.time-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  totalMinutes=parseInt(btn.dataset.min);
  resetTimer();
}
function buildSegments(){
  const seg=document.getElementById('segments');
  seg.innerHTML='';
  const hearts=['💜','💙','💚','💛','🧡','❤️','🩷','💜','💙','💚','💛','🧡'];
  for(let i=0;i<totalMinutes/5;i++){
    const d=document.createElement('div');
    d.className='seg';d.id='seg-'+i;
    d.textContent=hearts[i%hearts.length];
    seg.appendChild(d);
  }
}
function updateSegments(){
  const passed=Math.floor(elapsed/300);
  for(let i=0;i<totalMinutes/5;i++){
    const s=document.getElementById('seg-'+i);
    if(!s)continue;
    s.classList.remove('passed','current');
    if(i<passed)s.classList.add('passed');
    else if(i===passed&&elapsed>0)s.classList.add('current');
  }
}
function pad(n){return String(n).padStart(2,'0');}
function updateDisplay(){
  const big=document.getElementById('timeBig');
  big.textContent=pad(Math.floor(elapsed/60))+':'+pad(elapsed%60);
  big.className='time-big';
  const pct=elapsed/(totalMinutes*60);
  if(elapsed>=totalMinutes*60)big.classList.add('done-color');
  else if(pct>=0.8)big.classList.add('warning');
  else if(running)big.classList.add('running');
  document.getElementById('totalLabel').textContent='/ '+pad(totalMinutes)+':00';
  updateSegments();
}
function speak(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';u.rate=0.88;u.pitch=1.3;u.volume=1.0;
  window.speechSynthesis.speak(u);
}
function showBanner(text,done=false){
  const b=document.getElementById('announceBanner');
  b.textContent=text;
  b.className='announce-banner visible'+(done?' done-banner':'');
}
function updateCheer(){
  document.getElementById('cheerBox').textContent=cheerMessages[Math.floor(Math.random()*cheerMessages.length)];
}
function checkAnnounce(){
  const min=Math.floor(elapsed/60);
  if(elapsed%60!==0||min===0||min===lastAnnounced||min%5!==0)return;
  lastAnnounced=min;
  if(elapsed>=totalMinutes*60){
    speak('はい、終了です。よく頑張りましたね、ゆうほちゃん！えらいよ！');
    showBanner('🎉 おわり！よくがんばったね、ゆうほちゃん！',true);
    document.getElementById('mascot').textContent='🏆';
    launchConfetti();
    stopTimer(true);
  }else{
    speak(min+'分経過しました。ゆうほちゃん、いい調子だよ！');
    showBanner('✅ '+min+'ぷん けいかしたよ！すごい！');
    updateCheer();
    document.getElementById('mascot').textContent=mascots[Math.floor(Math.random()*mascots.length)];
  }
}
function launchConfetti(){
  const colors=['#ff6eb4','#c084fc','#ffb347','#ffd700','#5dba7a','#60a5fa'];
  for(let i=0;i<40;i++){
    const c=document.createElement('div');
    c.className='confetti-piece';
    c.style.left=Math.random()*100+'vw';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDelay=Math.random()*1.5+'s';
    c.style.animationDuration=(1.5+Math.random())+'s';
    c.style.borderRadius=Math.random()>0.5?'50%':'2px';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),4000);
  }
}
function startTimer(){
  if(running)return;
  running=true;
  document.getElementById('btnStart').style.display='none';
  document.getElementById('btnPause').style.display='';
  document.getElementById('btnReset').style.display='';
  document.querySelectorAll('.time-btn').forEach(b=>b.disabled=true);
  speak('ゆうほちゃん、集中して頑張ってね！');
  showBanner('🌸 よーし、スタート！がんばれ！');
  updateCheer();
  timer=setInterval(()=>{elapsed++;updateDisplay();checkAnnounce();},1000);
}
function pauseTimer(){
  if(!running)return;
  clearInterval(timer);running=false;
  document.getElementById('btnPause').textContent='▶ つづける';
  document.getElementById('btnPause').onclick=resumeTimer;
  showBanner('⏸ ちょっとひとやすみ？');
}
function resumeTimer(){
  running=true;
  document.getElementById('btnPause').textContent='⏸ ちょっとまって';
  document.getElementById('btnPause').onclick=pauseTimer;
  speak('さあ、また頑張ろう！ゆうほちゃん！');
  showBanner('💪 また頑張ろう！');
  timer=setInterval(()=>{elapsed++;updateDisplay();checkAnnounce();},1000);
}
function stopTimer(done){
  clearInterval(timer);running=false;
  if(!done){
    document.getElementById('btnStart').style.display='';
    document.getElementById('btnStart').textContent='✨ もう一回！';
  }else{
    document.getElementById('btnStart').style.display='none';
  }
  document.getElementById('btnPause').style.display='none';
}
function resetTimer(){
  clearInterval(timer);running=false;elapsed=0;lastAnnounced=-1;
  window.speechSynthesis&&window.speechSynthesis.cancel();
  document.getElementById('mascot').textContent='🌸';
  document.getElementById('btnStart').style.display='';
  document.getElementById('btnStart').textContent='✨ スタート！';
  document.getElementById('btnStart').onclick=startTimer;
  document.getElementById('btnPause').style.display='none';
  document.getElementById('btnReset').style.display='none';
  document.querySelectorAll('.time-btn').forEach(b=>b.disabled=false);
  showBanner('🎵 スタートをおしてね！');
  document.getElementById('cheerBox').textContent=cheerMessages[0];
  buildSegments();updateDisplay();
}
buildSegments();
updateDisplay();
</script>
</body>
</html>
